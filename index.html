<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding: 56px 32px;
        }
        .cube{
            width: 170px;
            height: 170px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .3s ease;
        }
        /* hover 时形状中间出现 "hover" 字样 */
        .cube::after{
            content: "hover";
            color: rgba(255,255,255,.92);
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity .3s ease;
        }
        .cube:hover::after{
            opacity: 1;
        }

        /* 1. 橙色直角正方形 */
        .c1{
            background: linear-gradient(135deg,#ff9a56,#ff5e62);
            box-shadow: 0 10px 24px rgba(255,94,98,.35);
        }
        .c1:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(255,94,98,.35);
        }

        /* 2. 绿色小圆角正方形 */
        .c2{
            border-radius: 20px;
            background: linear-gradient(135deg,#2ee6a8,#1abc9c);
            box-shadow: 0 10px 24px rgba(46,230,168,.35);
        }
        .c2:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(46,230,168,.35);
        }

        /* 3. 紫灰色大圆角正方形 */
        .c3{
            border-radius: 48px;
            background: linear-gradient(135deg,#b8a9c9,#8e7cc3);
            box-shadow: 0 10px 24px rgba(142,124,195,.35);
        }
        .c3:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(142,124,195,.35);
        }

        /* 4. 黄色圆形 */
        .c4{
            border-radius: 50%;
            background: linear-gradient(135deg,#ffd97d,#f9a825);
            box-shadow: 0 10px 24px rgba(249,168,37,.35);
        }
        .c4:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(249,168,37,.35);
        }

        /* 5. 深青色直角正方形 */
        .c5{
            background: linear-gradient(135deg,#3d7a6d,#2a5c50);
            box-shadow: 0 10px 24px rgba(61,122,109,.35);
        }
        .c5:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(61,122,109,.35);
        }

        /* 6. 淡紫色圆形 */
        .c6{
            border-radius: 50%;
            background: linear-gradient(135deg,#c9a9d9,#9d7bb8);
            box-shadow: 0 10px 24px rgba(169,129,197,.35);
        }
        .c6:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(169,129,197,.35);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
